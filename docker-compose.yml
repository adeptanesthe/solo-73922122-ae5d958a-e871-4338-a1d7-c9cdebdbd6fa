services:
  recommender:
    build: .
    image: topic-recommender:latest
    container_name: topic-recommender
    ports:
      - "8000:8000"
    volumes:
      - recommender-data:/data
    environment:
      RECOMMENDER_DB: /data/recommender.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  recommender-data:
